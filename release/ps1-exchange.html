<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Play Store â€“ Exchange to EV</title>
<link rel="stylesheet" href="screenshot-playstore-template.css"/>
<script src="screenshot-scale.js"></script></head>
<body><div class="root">
  <div class="heading">Exchange to EV</div>
  <div class="subheading">Trade Your Old Car for Electric</div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <!-- Status bar -->
        <div class="sbar">
          <span class="stime">1:08</span>
          <div class="sicons"><div class="sbat"><div class="sbat-fill"></div></div></div>
        </div>
        <!-- Header -->
        <div class="nav">
          <div class="nav-card">
            <div class="brand">
              <img class="logo-img" src="../assets/nepal-flag-logo.jpeg" alt="logo"/>
              <span class="bname">NEPAL Motor</span>
            </div>
            <div class="hbts">
              <div class="hbt">
                <svg viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
              </div>
              <div class="hbt">
                <svg viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
              </div>
            </div>
          </div>
        </div>
        <!-- Content -->
        <div class="content">
          <div class="ptitle">Exchange to EV</div>
          <div class="pdivider"></div>
          <div class="field-wrap">
            <div class="flabel">Full Name <span class="req">*</span></div>
            <div class="finput"></div>
          </div>
          <div class="field-wrap">
            <div class="flabel">Email</div>
            <div class="finput"></div>
          </div>
          <div class="field-wrap">
            <div class="flabel">Phone <span class="req">*</span></div>
            <div class="finput"></div>
          </div>
          <div class="field-wrap">
            <div class="flabel">City <span class="req">*</span></div>
            <div class="fselect"><span class="fselect-pill">Kathmandu</span><span class="fselect-arrow"></span></div>
          </div>
          <div class="field-wrap">
            <div class="flabel">Year of Manufacture <span class="req">*</span></div>
            <div class="finput"><span class="ftext">2007</span></div>
          </div>
          <div class="field-wrap">
            <div class="flabel">Vehicle Type <span class="req">*</span></div>
            <div class="fselect"><span class="fselect-pill">Hatchback</span><span class="fselect-arrow"></span></div>
          </div>
          <div class="field-wrap">
            <div class="flabel">Vehicle Model <span class="req">*</span></div>
            <div class="finput"></div>
          </div>
        </div>
        <!-- Bottom nav -->
        <div class="bnav">
          <div class="bnt">
            <div class="bnt-icon active-bg"><img src="../assets/exchange-svgrepo.svg" class="blue-icon" alt="exchange"/></div>
            <div class="bnt-label active">Exchange</div>
          </div>
          <div class="bnt">
            <div class="bnt-icon"><img src="../assets/graphql-svgrepo.svg" class="gray-icon" alt="faqs"/></div>
            <div class="bnt-label">FAQs</div>
          </div>
          <div class="bnt">
            <div class="bnt-icon"><img src="../assets/car-side-svgrepo.svg" class="gray-icon" alt="sell"/></div>
            <div class="bnt-label">Sell</div>
          </div>
          <div class="bnt">
            <div class="bnt-icon"><img src="../assets/steering-2-fill-svgrepo.svg" class="gray-icon" alt="about"/></div>
            <div class="bnt-label">About</div>
          </div>
          <div class="bnt">
            <div class="bnt-icon"><img src="../assets/location-pin-svgrepo.svg" class="gray-icon" alt="dealers"/></div>
            <div class="bnt-label">Dealers</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div></body>
</html>
