<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEPAL Motor Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0c4a6e 0%, #075985 50%, #0369a1 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .phone {
    width: 320px;
    height: 660px;
    background: #111318;
    border-radius: 50px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #2b2d31,
      0 0 0 4px #111318,
      0 40px 80px rgba(0,0,0,0.6),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }

  .phone-inner {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Dynamic island */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 26px;
    background: #111318;
    border-radius: 20px;
    z-index: 10;
  }

  /* Status bar */
  .status-bar {
    height: 48px;
    background: #ffffff;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 6px;
    font-size: 11px;
    font-weight: 700;
    color: #0f172a;
    flex-shrink: 0;
  }

  .status-icons { display: flex; gap: 5px; align-items: center; }
  .battery {
    width: 22px; height: 11px;
    border: 1.5px solid #0f172a;
    border-radius: 2px;
    position: relative;
  }
  .battery::after {
    content: '';
    position: absolute;
    right: -4px; top: 50%;
    transform: translateY(-50%);
    width: 2.5px; height: 5px;
    background: #0f172a;
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    width: 75%; height: 100%;
    background: #0f172a;
    border-radius: 1px;
  }

  /* Header nav */
  .header {
    background: #ffffff;
    padding: 0 14px 8px;
    flex-shrink: 0;
  }
  .nav-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-circle {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #075985, #0ea5e9);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 900; font-size: 11px;
    letter-spacing: -0.5px;
  }
  .brand-text { font-size: 13px; font-weight: 900; color: #075985; }
  .brand-sub { font-size: 8px; color: #64748b; font-weight: 600; letter-spacing: 0.5px; }
  .header-icons { display: flex; gap: 6px; }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: #f1f5f9;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }

  /* Content */
  .content {
    flex: 1;
    overflow: hidden;
    padding: 14px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .page-title {
    font-size: 18px;
    font-weight: 900;
    color: #020617;
  }

  .form-field {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 2px 6px rgba(7,89,133,0.06);
  }
  .field-label {
    font-size: 8px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .field-value {
    font-size: 12px;
    font-weight: 600;
    color: #0f172a;
  }
  .field-placeholder { color: #94a3b8; font-weight: 400; }

  .fields-row { display: flex; gap: 8px; }
  .fields-row .form-field { flex: 1; }

  .submit-btn {
    background: linear-gradient(135deg, #075985, #0ea5e9);
    color: white;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 14px rgba(7,89,133,0.35);
    margin-top: 2px;
  }

  /* Footer nav */
  .footer {
    padding: 0 10px 10px;
    flex-shrink: 0;
  }
  .footer-nav {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 6px 4px;
    display: flex;
    justify-content: space-around;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  }
  .nav-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    padding: 5px 8px;
    border-radius: 10px;
    font-size: 7.5px;
    font-weight: 800;
    color: #64748b;
    min-width: 44px;
  }
  .nav-item.active {
    background: #e0f2fe;
    color: #075985;
  }
  .nav-icon { font-size: 17px; line-height: 1; }
</style>
</head>
<body>

<div class="phone">
  <div class="phone-inner">
    <div class="dynamic-island"></div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <span>▲▲▲</span>
        <span>WiFi</span>
        <div class="battery"><div class="battery-fill"></div></div>
      </div>
    </div>

    <!-- Header -->
    <div class="header">
      <div class="nav-card">
        <div class="brand">
          <div class="logo-circle">NM</div>
          <div>
            <div class="brand-text">NEPAL Motor</div>
            <div class="brand-sub">CAR EXCHANGE · BUY · SELL</div>
          </div>
        </div>
        <div class="header-icons">
          <div class="icon-btn">📞</div>
          <div class="icon-btn">☰</div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="page-title">Exchange to EV</div>

      <div class="form-field">
        <div class="field-label">Full Name *</div>
        <div class="field-value field-placeholder">Enter your full name</div>
      </div>

      <div class="fields-row">
        <div class="form-field">
          <div class="field-label">Phone *</div>
          <div class="field-value field-placeholder">98XXXXXXXX</div>
        </div>
        <div class="form-field">
          <div class="field-label">City *</div>
          <div class="field-value">Kathmandu ▾</div>
        </div>
      </div>

      <div class="fields-row">
        <div class="form-field">
          <div class="field-label">Vehicle Type *</div>
          <div class="field-value">Hatchback ▾</div>
        </div>
        <div class="form-field">
          <div class="field-label">Fuel Type *</div>
          <div class="field-value">Petrol ▾</div>
        </div>
      </div>

      <div class="fields-row">
        <div class="form-field">
          <div class="field-label">Brand *</div>
          <div class="field-value field-placeholder">Hyundai</div>
        </div>
        <div class="form-field">
          <div class="field-label">Model *</div>
          <div class="field-value field-placeholder">Santro</div>
        </div>
      </div>

      <div class="submit-btn">Submit Exchange Request →</div>
    </div>

    <!-- Footer Nav -->
    <div class="footer">
      <div class="footer-nav">
        <div class="nav-item active">
          <div class="nav-icon">⇄</div>
          Exchange
        </div>
        <div class="nav-item">
          <div class="nav-icon">💬</div>
          FAQs
        </div>
        <div class="nav-item">
          <div class="nav-icon">🚗</div>
          Sell
        </div>
        <div class="nav-item">
          <div class="nav-icon">ℹ</div>
          About
        </div>
        <div class="nav-item">
          <div class="nav-icon">📍</div>
          Dealers
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
