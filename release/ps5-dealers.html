<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="screenshot-playstore-template.css"/>
<style>
  .filter-label { font-size:12px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
  .filter-row { border:1.5px solid #d1d5db; border-radius:10px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .filter-val { font-size:15px; font-weight:600; color:#0f172a; }
  .dealer-card { border:1.5px solid #e2e8f0; border-radius:14px; padding:14px; display:flex; gap:12px; background:white; }
  .dealer-icon { width:42px; height:42px; border-radius:12px; background:#dbeafe; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .dealer-icon img { width:22px; height:22px; filter:invert(27%) sepia(100%) saturate(500%) hue-rotate(190deg) brightness(90%); }
  .dealer-info { flex:1; }
  .dealer-name { font-size:17px; font-weight:900; color:#0f172a; }
  .dealer-city { font-size:14px; font-weight:700; color:#1d4ed8; margin-top:2px; }
  .dealer-contact { font-size:13px; color:#6b7280; margin-top:2px; }
  .dealer-phone { display:inline-flex; align-items:center; gap:6px; background:#dbeafe; border-radius:8px; padding:5px 12px; margin-top:7px; }
  .dealer-phone svg { width:14px; height:14px; }
  .dealer-phone span { font-size:14px; font-weight:800; color:#1d4ed8; }
</style>
<script src="screenshot-scale.js"></script></head>
