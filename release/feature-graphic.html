<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>NEPAL Motor &#x2013; Feature Graphic 1024&#xD7;500</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#a8bccf; }
  .root {
    width:1024px; height:500px;
    background:#d6e8f7;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 52px 0 68px;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transform-origin:top left;
    position:absolute; top:0; left:0;
    overflow:hidden;
  }

  /* ── Left content ── */
  .left {
    display:flex; flex-direction:column; align-items:flex-start;
    gap:14px; z-index:1; max-width:440px;
  }
  .brand-row { display:flex; align-items:center; gap:13px; }
  .brand-logo {
    width:58px; height:58px; flex-shrink:0;
    background:#d6e8f7; isolation:isolate;
  }
  .brand-logo img { width:100%; height:100%; object-fit:contain; display:block; mix-blend-mode:multiply; }
  .brand-name { font-size:30px; font-weight:900; color:#0f172a; letter-spacing:-0.5px; }

  .headline { font-size:44px; font-weight:900; color:#0f172a; line-height:1.12; letter-spacing:-1.5px; }
  .headline .accent { color:#7c3aed; }

  .tagline { font-size:17px; font-weight:600; color:#475569; letter-spacing:0.3px; }

  .pills { display:flex; flex-wrap:wrap; gap:7px; }
  .pill {
    background:rgba(255,255,255,0.78);
    border:1.5px solid rgba(255,255,255,0.95);
    color:#1e293b; font-size:12.5px; font-weight:700;
    padding:5px 13px; border-radius:999px;
  }

  /* ── Right: screenshots only ── */
  .phones {
    display:flex; align-items:center; gap:18px;
    flex-shrink:0; align-self:center;
  }

  .s24 {
    width:188px; height:408px;
    border-radius:28px;
    overflow:hidden; flex-shrink:0;
    background:#d6e8f7;
    position:relative;
  }
  .s24.back {
    height:364px;
    opacity:0.92;
    transform:translateY(22px);
  }

  .camera { display:none; }
  .s24::before, .s24::after { display:none; }

  .s24-screen {
    width:100%; height:100%;
    overflow:hidden;
  }
  .s24-screen img {
    width:100%; height:100%;
    object-fit:cover; display:block;
  }
</style>
<script>
  function fit() {
    var r = document.querySelector('.root');
    var s = Math.min(window.innerWidth / 1024, window.innerHeight / 500);
    r.style.transform = 'scale(' + s + ')';
    r.style.left = ((window.innerWidth  - 1024 * s) / 2) + 'px';
    r.style.top  = ((window.innerHeight - 500  * s) / 2) + 'px';
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
</script>
</head>
<body><div class="root">

  <!-- Left branding -->
  <div class="left">
    <div class="brand-row">
      <div class="brand-logo"><img src="../assets/nepal-motor-icon.png" alt="NEPAL Motor"/></div>
      <div class="brand-name">NEPAL Motor</div>
    </div>
    <div class="headline">Nepal&#x2019;s Trusted<br><span class="accent">Car Platform</span></div>
    <div class="tagline">Exchange &#183; Buy &#183; Sell</div>
    <div class="pills">
      <div class="pill"> Exchange to EV</div>
      <div class="pill"> Sell Used Car</div>
      <div class="pill"> Buy Used Car</div>
      <div class="pill"> Free Test Drive</div>
    </div>
  </div>

  <!-- Right: two S24 Ultra phones -->
  <div class="phones">

    <!-- Back phone: Dealers -->
    <div class="s24 back">
      <div class="camera"></div>
      <div class="s24-screen">
        <img src="screenshots/07-dealers.jpg.png" alt="Dealers"/>
      </div>
    </div>

    <!-- Front phone: About -->
    <div class="s24">
      <div class="camera"></div>
      <div class="s24-screen">
        <img src="screenshots/06-about.jpg.png" alt="About"/>
      </div>
    </div>

  </div>

</div></body>
</html>
